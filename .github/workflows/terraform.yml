name: Terraform

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # Azure 로그인용 임시 토큰
  contents: read

concurrency:
  group: terraform   # 동시에 두 번 돌지 않게
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -diff

      - name: Init (tfstate 연결)
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan (무엇이 바뀌는지 미리 보기)
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo "## Terraform plan"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # main 에 반영됐을 때만 실제로 만들기
      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
