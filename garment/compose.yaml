# 역할: 서비스 컨테이너·환경변수·볼륨과 시작 순서를 정의합니다.
name: fitme-garment
services:
  garment:
    build: .
    image: fitme-garment:local
    env_file: .env
    ports:
      - "${VM_BIND_IP:-127.0.0.1}:8002:8002"
    restart: unless-stopped
    volumes:
      - "garment-model-cache:/models/cache"
volumes:
  garment-model-cache:
